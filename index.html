<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sociologins grunder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <img class="logo henke" src="assets/larar-henke.png" alt="Lärar Henke">
    <div class="title">
      <h1>SOCIOLOGINS GRUNDER</h1>
      <p>BEGREPP</p>
    </div>
    <img class="logo alstromer" src="assets/alstromer.png" alt="Alströmergymnasiet">
  </header>

  <section id="home" class="screen active">
    <div class="menu">
      <button class="menu-card" data-action="reading">
        <span class="card-icon">⌕</span>
        <span><strong>VAD ÄR SOCIOLOGI? – QUIZ</strong><small>Testa din förståelse av häftet med 7 slumpade frågor.</small></span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-card" data-action="conceptQuiz">
        <span class="card-icon">?</span>
        <span><strong>BEGREPPSQUIZ</strong><small>Träna viktiga sociologiska begrepp med 15 frågor.</small></span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-card" data-action="cards">
        <span class="card-icon">▱</span>
        <span><strong>BEGREPPSKORT</strong><small>Lär dig begreppen med digitala kort.</small></span>
        <span class="arrow">›</span>
      </button>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="quiz-head">
      <button class="text-btn" data-home>← Huvudmeny</button>
      <div>
        <h2 id="quizTitle"></h2>
        <p id="progress"></p>
      </div>
    </div>
    <div class="question-card">
      <h3 id="questionText"></h3>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="primary hidden">Nästa fråga</button>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="result-card">
      <h2>RESULTAT</h2>
      <div id="score" class="score"></div>
      <div id="resultLead" class="result-lead"></div>
      <div id="resultText"></div>
      <div class="result-actions">
        <button class="primary" data-home>Till huvudmenyn</button>
        <button id="retryBtn" class="secondary">Öva igen</button>
      </div>
    </div>
  </section>

  <section id="cards" class="screen">
    <div class="quiz-head">
      <button class="text-btn" data-home>← Huvudmeny</button>
      <div><h2>BEGREPPSKORT</h2><p>Klicka på ett kort för att vända det.</p></div>
    </div>
    <div id="cardsGrid" class="cards-grid"></div>
  </section>

  <footer>© Henrik Sjöqvist | Alströmergymnasiet</footer>
</main>
<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
